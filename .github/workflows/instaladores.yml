name: Instaladores

# Genera el instalador de Windows (.exe) y la imagen de macOS (.dmg).
# - En cada PR y push a main: quedan como artefactos de la ejecución.
# - Al crear una etiqueta vX.Y.Z: además se publican en una Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS-AppleSilicon
          - os: macos-15-intel
            name: macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Versión
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"; fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Empaquetar con PyInstaller
        run: pyinstaller packaging/flightcase.spec --noconfirm --distpath dist --workpath build

      - name: Instalador de Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" packaging\windows_installer.iss

      - name: Imagen DMG de macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg
          cp -R "dist/Flightcase Calculator.app" dmg/
          ln -s /Applications dmg/Aplicaciones
          hdiutil create -volname "Flightcase Calculator" -srcfolder dmg -ov -format UDZO \
            "dist/FlightcaseCalculator-${APP_VERSION}-${{ matrix.name }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: FlightcaseCalculator-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
